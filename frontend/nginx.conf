server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: forward to the backend container
    location /api/ {
        proxy_pass http://api:3000;
    }

    location /health {
        proxy_pass http://api:3000;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
